name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV; else echo "VERSION=1.0.0" >> $GITHUB_ENV; fi
      - name: Publish
        run: dotnet publish src/Winddy/Winddy.csproj -c Release -r win-${{ matrix.arch }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ env.VERSION }} -o publish/${{ matrix.arch }}
      - name: Rename
        shell: bash
        run: mv publish/${{ matrix.arch }}/Winddy.exe publish/Winddy-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Winddy-${{ matrix.arch }}
          path: publish/Winddy-${{ matrix.arch }}.exe
      # The updater looks for Winddy-x64.exe / Winddy-arm64.exe in the latest release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Winddy-${{ matrix.arch }}.exe
          generate_release_notes: true
